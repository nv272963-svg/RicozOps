<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RicozOps</title>
<<link rel="stylesheet" href="assets/css/login.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="left">

        <h1>RicozOps</h1>
        <p class="tagline">Business Operations Management Platform</p>
        <h2>Welcome Back 👋</h2>

        <p>Sign in to continue managing your business operations.</p>

    </div>

    <div class="right">

       <!-- LOGIN FORM -->

<form id="loginForm">

    <h2>Login</h2>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
            type="password"
            id="password"
            placeholder="Password"
            required>
    </div>

    <div class="options">
        <label>
            <input type="checkbox">
            Remember Me
        </label>

        <a href="#" id="forgotPasswordLink">
            Forgot Password?
        </a>
    </div>

    <button type="submit">
        Login
    </button>

    <p class="switch-form">
        Don't have an account?
        <a href="#" id="showRegister">
            Register
        </a>
    </p>

</form>



<!-- REGISTER FORM -->

<form id="registerForm" style="display:none;">

    <h2>Create Account</h2>

    <div class="input-box">
        <i class="fa-solid fa-user"></i>
        <input
            type="text"
            id="full_name"
            placeholder="Full Name"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input
            type="email"
            id="reg_email"
            placeholder="Email Address"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-phone"></i>
        <input
            type="text"
            id="mobile"
            placeholder="Mobile Number"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
            type="password"
            id="reg_password"
            placeholder="Password"
            required>
    </div>

    <button type="submit">
        Register
    </button>

    <p class="switch-form">
        Already have an account?
        <a href="#" id="showLogin">
            Login
        </a>
    </p>

</form>
    </div>

</div>
<script src="assets/js/login.js"></script>
</body>
</html>
